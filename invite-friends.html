<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invite Friends | Chain65</title>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #000000;
      color: white;
      text-align: center;
      min-height: 100vh;
    }
    .header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000000;
      color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgb(255, 255, 255);
    }
    .container {
      max-width: 500px;
      margin: 70px auto 20px;
      padding: 20px;
    }
    .card {
      background: #111;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
    }
    .stat-box {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
    }
    .stat {
      background: #6b6a6a50;
      padding: 15px;
      border-radius: 8px;
      flex: 1;
      margin: 0 5px;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
    }
    .stat-value {
      font-size: 24px;
      color: #ffffff;
      font-weight: bold;
    }
    .stat-label {
      font-size: 12px;
      color: #ffffff;
    }
    .referral-link {
      margin: 20px 0;
    }
    .referral-link input {
      width: 80%;
      padding: 10px;
      border-radius: 5px;
      border: none;
      background: #c7c4c4;
      color: rgb(0, 0, 0);
      text-align: center;
      margin-bottom: 10px;
      user-select: all;
    }
    .btn {
      background: #494848;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      width: 25%;
      margin: 5px 0;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
      transition: all 0.3s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-copy {
      background: #5e5d5d;
    }
    .share-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .share-btn {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
    }
    .whatsapp { background: #000000; }
    .telegram { background: #000000; }
    .facebook { background: #000000; }
    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #000;
      padding: 10px 0;
      display: flex;
      justify-content: space-around;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
    }
    .nav-item {
      text-decoration: none;
      color: white;
      font-size: 12px;
      padding: 8px;
      background: #111;
      border-radius: 5px;
      width: 80px;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
    }
    .popup {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #000000;
      color: white;
      padding: 10px 20px;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
      border-radius: 5px;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="header">
    <div id="username" class="user-id"></div>
    <div id="userReferralCode"></div>
  </div>

  <div class="container">
    <div class="card">
      <h3>Your Referral Stats</h3>
      <div class="stat-box">
        <div class="stat">
          <div class="stat-value" id="referralCount">0</div>
          <div class="stat-label">Friends Invited</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="referralBonus">0 C65</div>
          <div class="stat-label">Bonus Earned</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Your Referral Link</h3>
      <div class="referral-link">
        <input type="text" id="referralLink" readonly />
        <button class="btn btn-copy" onclick="copyReferralLink()">Copy Link</button>
      </div>
      <p class="note" WhatsApp/Facebook sharing may not work inside Telegram app. Open in browser for full features.</p>
    </div>

    <div class="share-buttons">
      <div class="share-btn whatsapp" onclick="shareWhatsApp()">
        <i class="fab fa-whatsapp"></i> WhatsApp
      </div>
      <div class="share-btn telegram" onclick="shareTelegram()">
        <i class="fab fa-telegram"></i> Telegram
      </div>
      <div class="share-btn facebook" onclick="shareFacebook()">
        <i class="fab fa-facebook"></i> Facebook
      </div>
    </div>
  </div>

  <div class="popup" id="popup">Link Copied!</div>

  <div class="footer">
    <a class="nav-item" href="home.html"><i class="fas fa-home"></i> Home</a>
    <a class="nav-item" href="invite-friends.html"><i class="fas fa-user-friends"></i> Friends</a>
    <a class="nav-item" href="white-paper.html"><i class="fas fa-tasks"></i> White paper</a>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC2klHcVeyNOl5etmxb0N9hZlBUCN-g6YA",
      authDomain: "chain-65-network.firebaseapp.com",
      databaseURL: "https://chain-65-network-default-rtdb.firebaseio.com",
      projectId: "chain-65-network",
      storageBucket: "chain-65-network.appspot.com",
      messagingSenderId: "1044867567779",
      appId: "1:1044867567779:web:3f9d71c9d08f4cf7beaf16"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUserId = null;
    let userData = null;

    signInAnonymously(auth)
      .then(() => console.log("Signed in anonymously"))
      .catch(error => console.error("Auth error:", error));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.uid;
        await createUserInDB(currentUserId);
        await loadUserData(currentUserId);

        await checkReferralCode();  // Check referral and update DB if needed

        updateUI();
      }
    });

    async function createUserInDB(uid) {
      const userRef = ref(db, `users/${uid}`);
      const snapshot = await get(userRef);
      if (!snapshot.exists()) {
        const referralCode = generateReferralCode();
        await set(userRef, {
          referralCode: referralCode,
          referrals: 0,
          referralBonus: 0,
          createdAt: new Date().toISOString()
        });
        await set(ref(db, `referralCodes/${referralCode}`), uid);
      }
    }

    async function loadUserData(uid) {
      const snapshot = await get(ref(db, `users/${uid}`));
      if (snapshot.exists()) {
        userData = snapshot.val();
      }
    }

    async function checkReferralCode() {
      const urlParams = new URLSearchParams(window.location.search);
      const refCode = urlParams.get("ref");

      if (refCode && refCode !== userData?.referralCode) {
        const refCodeSnapshot = await get(ref(db, `referralCodes/${refCode}`));
        if (refCodeSnapshot.exists()) {
          const referrerUid = refCodeSnapshot.val();
          const referrerRef = ref(db, `users/${referrerUid}`);

          const referrerSnap = await get(referrerRef);
          if (referrerSnap.exists()) {
            const referrerData = referrerSnap.val();
            await set(referrerRef, {
              ...referrerData,
              referrals: (referrerData.referrals || 0) + 1,
              referralBonus: (referrerData.referralBonus || 0) + 1
            });
          }
        }
      }
    }

    function updateUI() {
      if (!userData) return;
      document.getElementById("referralCount").textContent = userData.referrals || 0;
      document.getElementById("referralBonus").textContent = (userData.referralBonus || 0).toFixed(5) + " C65";

      const currentUrl = window.location.href.split("?")[0].replace("invite-friends.html", "");
      document.getElementById("referralLink").value = `${currentUrl}?ref=${userData.referralCode}`;
    }

    function generateReferralCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    const referralBase = "https://t.me/Chain65bot";

    // These functions open share links in new tabs or native apps if possible
    window.shareWhatsApp = function () {
      const fullMessage = `🚀 Join Chain65 and earn rewards! 💰 ${referralBase}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(fullMessage)}`, "_blank");
    };

    window.shareTelegram = function () {
      const telegramShareURL = `https://t.me/share/url?url=${encodeURIComponent(referralBase)}&text=${encodeURIComponent("🚀 Join Chain65 and earn rewards! 💰")}`;
      window.open(telegramShareURL, "_blank");
    };

    window.shareFacebook = function () {
      const fbUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(referralBase)}`;
      window.open(fbUrl, "_blank");
    };

    window.copyReferralLink = function () {
      const link = document.getElementById("referralLink").value;
      navigator.clipboard.writeText(link)
        .then(() => showPopup())
        .catch(() => alert("Failed to copy link. Try manually."));
    };

    function showPopup() {
      const popup = document.getElementById("popup");
      popup.style.display = "block";
      setTimeout(() => {
        popup.style.display = "none";
      }, 2000);
    }
  </script>
</body>
</html>
