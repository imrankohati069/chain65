<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invite Friends | Chain65</title>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
      text-align: center;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    #popup {
      display: none;
      background-color: #000;
      color: #fff;
      padding: 10px;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h2>Invite Friends and Earn!</h2>
  <input type="text" id="referralLink" readonly>
  <br>
  <button onclick="copyReferralLink()">Copy Link</button>
  <button onclick="shareWhatsApp()">Share WhatsApp</button>
  <button onclick="shareTelegram()">Share Telegram</button>
  <button onclick="shareFacebook()">Share Facebook</button>

  <div id="popup"></div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyC2klHcVeyNOl5etmxb0N9hZlBUCN-g6YA",
      authDomain: "chain-65-network.firebaseapp.com",
      projectId: "chain-65-network",
      storageBucket: "chain-65-network.appspot.com",
      messagingSenderId: "1044867567779",
      appId: "1:1044867567779:web:3f9d71c9d08f4cf7beaf16"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUserId = null;
    let userData = null;

    // Anonymous sign-in
    auth.signInAnonymously().catch(console.error);

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUserId = user.uid;
        await loadUserData();
        updateUI();
      }
    });

    async function loadUserData() {
      const userRef = db.collection("users").doc(currentUserId);
      const doc = await userRef.get();

      if (doc.exists) {
        userData = doc.data();
      } else {
        const referralCode = generateReferralCode();
        await userRef.set({
          referralCode,
          referrals: 0,
          referralBonus: 0,
          createdAt: new Date()
        });
        userData = (await userRef.get()).data();
      }
    }

    function generateReferralCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function updateUI() {
      if (!userData) return;
      const baseUrl = window.location.origin + window.location.pathname.replace('invite-friends.html', 'home.html');
      const referralUrl = `${baseUrl}?ref=${userData.referralCode}`;
      document.getElementById("referralLink").value = referralUrl;
    }

    function showPopup(message) {
      const popup = document.getElementById("popup");
      popup.textContent = message;
      popup.style.display = "block";
      setTimeout(() => {
        popup.style.display = "none";
      }, 2000);
    }

    function copyReferralLink() {
      const input = document.getElementById("referralLink");
      input.select();
      document.execCommand("copy");
      showPopup("Link copied!");
    }

    function shareWhatsApp() {
      if (!userData) return showPopup("Loading...");
      const link = document.getElementById("referralLink").value;
      const message = `Join Chain65 and earn crypto! Use my referral link: ${link}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
    }

    function shareTelegram() {
      if (!userData) return showPopup("Loading...");
      const link = document.getElementById("referralLink").value;
      const message = `Join Chain65 and earn crypto! Use my referral link: ${link}`;
      window.open(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(message)}`, '_blank');
    }

    function shareFacebook() {
      if (!userData) return showPopup("Loading...");
      const link = document.getElementById("referralLink").value;
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}`, '_blank');
    }
  </script>
</body>
</html>
