<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invite Friends | Chain65</title>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #000000;
      color: white;
      text-align: center;
      min-height: 100vh;
    }
    .header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000000;
      color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgb(255, 255, 255);
      z-index: 10;
    }
    .container {
      max-width: 500px;
      margin: 60px auto 80px; /* top margin for fixed header, bottom for footer */
      padding: 20px;
    }
    .card {
      background: #111;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
    }
    .stat-box {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
    }
    .stat {
      background: #6b6a6a50;
      padding: 15px;
      border-radius: 8px;
      flex: 1;
      margin: 0 5px;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
    }
    .stat-value {
      font-size: 24px;
      color: #ffffff;
      font-weight: bold;
    }
    .stat-label {
      font-size: 12px;
      color: #ffffff;
    }
    .referral-link {
      margin: 20px 0;
    }
    .referral-link input {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: none;
      background: #c7c4c4;
      color: rgb(0, 0, 0);
      text-align: center;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .btn {
      background: #494848;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      width: 25%;
      margin: 5px 0;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
      transition: all 0.3s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-copy {
      background: #5e5d5d;
    }
    .btn-share {
      background: #555454;
    }
    .share-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      justify-content: center;
    }
    .share-btn {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: bold;
      user-select: none;
      background: #222;
      transition: background-color 0.3s;
    }
    .share-btn:hover {
      background: #555;
    }
    .whatsapp {
      background: #25d366;
    }
    .telegram {
      background: #0088cc;
    }
    .facebook {
      background: #3b5998;
    }
    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #000;
      padding: 10px 0;
      display: flex;
      justify-content: space-around;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
      z-index: 10;
    }
    .nav-item {
      text-decoration: none;
      color: white;
      font-size: 12px;
      padding: 8px;
      background: #111;
      border-radius: 5px;
      width: 80px;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .popup {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #000000;
      color: white;
      padding: 10px 20px;
      box-shadow: 0 4px 15px rgb(255, 255, 255);
      border-radius: 5px;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Chain65 Referral</h2>
  </div>

  <div class="container">
    <div class="card">
      <h3>Your Referral Stats</h3>
      <div class="stat-box">
        <div class="stat">
          <div class="stat-value" id="referralCount">0</div>
          <div class="stat-label">Friends Invited</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="referralBonus">0 C65</div>
          <div class="stat-label">Bonus Earned</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Your Referral Link</h3>
      <div class="referral-link">
        <input type="text" id="referralLink" readonly />
        <button class="btn btn-copy" onclick="copyReferralLink()">Copy Link</button>
      </div>
      <p>Share your link and earn rewards when friends join!</p>

      <div class="share-buttons">
        <div class="share-btn whatsapp" onclick="shareWhatsApp()">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </div>
        <div class="share-btn telegram" onclick="shareTelegram()">
          <i class="fab fa-telegram"></i> Telegram
        </div>
        <div class="share-btn facebook" onclick="shareFacebook()">
          <i class="fab fa-facebook-f"></i> Facebook
        </div>
      </div>
    </div>
  </div>

  <div class="popup" id="popup">Link Copied!</div>

  <div class="footer">
    <a class="nav-item" href="home.html">
      <i class="fas fa-home"></i> Home
    </a>
    <a class="nav-item" href="invite-friends.html">
      <i class="fas fa-user-friends"></i> Friends
    </a>
    <a class="nav-item" href="white-paper.html">
      <i class="fas fa-file-alt"></i> White paper
    </a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC2klHcVeyNOl5etmxb0N9hZlBUCN-g6YA",
      authDomain: "chain-65-network.firebaseapp.com",
      projectId: "chain-65-network",
      storageBucket: "chain-65-network.appspot.com",
      messagingSenderId: "1044867567779",
      appId: "1:1044867567779:web:3f9d71c9d08f4cf7beaf16"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserId = null;
    let userData = null;

    signInAnonymously(auth)
      .then(() => console.log("Signed in anonymously"))
      .catch(error => console.error("Auth error:", error));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.uid;
        await loadUserData();
        updateUI();
      }
    });

    async function loadUserData() {
      const userRef = doc(db, "users", currentUserId);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {
        userData = userSnap.data();
      } else {
        await setDoc(userRef, {
          createdAt: new Date(),
          referralCode: generateReferralCode(),
          referrals: 0,
          referralBonus: 0
        });
        userData = (await getDoc(userRef)).data();
      }
    }

    function generateReferralCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    function updateUI() {
      if (!userData) return;

      document.getElementById("referralCount").textContent = userData.referrals || 0;
      document.getElementById("referralBonus").textContent = (userData.referralBonus || 0).toFixed(5) + " C65";

      const currentUrl = window.location.href.split('?')[0].replace('invite-friends.html', '');
      document.getElementById("referralLink").value = `${currentUrl}?ref=${userData.referralCode}`;
    }

    window.copyReferralLink = function () {
      const referralLink = document.getElementById("referralLink");
      referralLink.select();
      document.execCommand("copy");
      showPopup("Link copied!");
    };

    window.shareWhatsApp = function () {
      const link = document.getElementById("referralLink").value;
      const message = "Join Chain65 and earn crypto!";
      // WhatsApp sharing with message and link separated properly
      window.open(`https://wa.me/?text=${encodeURIComponent(message)}%20${encodeURIComponent(link)}`, "_blank");
    };

    window.shareTelegram = function () {
      const message = "Join Chain65 and earn crypto!";
      const url = document.getElementById("referralLink").value;
      const telegramShareURL = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(message)}`;
      window.open(telegramShareURL, "_blank");
    };

    window.shareFacebook = function () {
      const link = document.getElementById("referralLink").value;
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}`, "_blank");
    };

    function showPopup(message) {
      const popup = document.getElementById("popup");
      popup.textContent = message;
      popup.style.display = "block";
      setTimeout(() => {
        popup.style.display = "none";
      }, 2000);
    }
  </script>
</body>
</html>
