<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invite Friends | Chain65</title>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #000000;
      color: white;
      text-align: center;
      min-height: 100vh;
    }
    .header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 10px 0;
      background: #000;
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
      z-index: 10;
      box-shadow: 0 0 5px #fff;
    }
    .container {
      max-width: 480px;
      margin: 70px auto 90px;
      padding: 20px;
      background: #111;
      border-radius: 10px;
      box-shadow: 0 0 15px #fff;
    }
    .stat-box {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 15px;
    }
    .stat {
      flex: 1;
      background: #222;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 8px #aaa;
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .stat-label {
      font-size: 0.9rem;
      color: #bbb;
    }
    .referral-link {
      margin-bottom: 20px;
    }
    .referral-link input {
      width: 100%;
      padding: 12px;
      font-weight: bold;
      border-radius: 5px;
      border: none;
      text-align: center;
      user-select: all;
    }
    .btn-copy {
      background: #444;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: 0 0 8px #888;
      margin-top: 10px;
      width: 100%;
      transition: background-color 0.3s;
    }
    .btn-copy:hover {
      background: #666;
    }
    .share-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }
    .share-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 5px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px #555;
      color: #fff;
      user-select: none;
      transition: background-color 0.3s;
      font-size: 0.9rem;
    }
    .share-btn i {
      font-size: 1.3rem;
    }
    .whatsapp {
      background: #25d366;
    }
    .whatsapp:hover {
      background: #1ebe57;
    }
    .telegram {
      background: #0088cc;
    }
    .telegram:hover {
      background: #006f9a;
    }
    .facebook {
      background: #3b5998;
    }
    .facebook:hover {
      background: #2d4373;
    }
    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      box-shadow: 0 0 8px #fff;
      z-index: 10;
    }
    .nav-item {
      color: white;
      text-decoration: none;
      font-size: 0.9rem;
      background: #222;
      padding: 8px 12px;
      border-radius: 5px;
      box-shadow: 0 0 8px #444;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      transition: background-color 0.3s;
    }
    .nav-item:hover {
      background: #444;
    }
    .popup {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      box-shadow: 0 0 10px #555;
      display: none;
      z-index: 9999;
      font-weight: bold;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="header">Chain65 Referral</div>

  <div class="container">

    <div class="stat-box">
      <div class="stat">
        <div class="stat-value" id="referralCount">0</div>
        <div class="stat-label">Friends Invited</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="referralBonus">0 C65</div>
        <div class="stat-label">Bonus Earned</div>
      </div>
    </div>

    <div class="referral-link">
      <input type="text" id="referralLink" readonly />
      <button class="btn-copy" onclick="copyReferralLink()">Copy Referral Link</button>
    </div>

    <div class="share-buttons">
      <div class="share-btn whatsapp" onclick="shareWhatsApp()">
        <i class="fab fa-whatsapp"></i> WhatsApp
      </div>
      <div class="share-btn telegram" onclick="shareTelegram()">
        <i class="fab fa-telegram"></i> Telegram
      </div>
      <div class="share-btn facebook" onclick="shareFacebook()">
        <i class="fab fa-facebook-f"></i> Facebook
      </div>
    </div>

  </div>

  <div class="popup" id="popup">Link Copied!</div>

  <div class="footer">
    <a href="home.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
    <a href="invite-friends.html" class="nav-item"><i class="fas fa-user-friends"></i> Friends</a>
    <a href="white-paper.html" class="nav-item"><i class="fas fa-file-alt"></i> White paper</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC2klHcVeyNOl5etmxb0N9hZlBUCN-g6YA",
      authDomain: "chain-65-network.firebaseapp.com",
      projectId: "chain-65-network",
      storageBucket: "chain-65-network.appspot.com",
      messagingSenderId: "1044867567779",
      appId: "1:1044867567779:web:3f9d71c9d08f4cf7beaf16"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserId = null;
    let userData = null;

    // Anonymous sign-in
    signInAnonymously(auth)
      .then(() => console.log("Signed in anonymously"))
      .catch(error => console.error("Auth error:", error));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.uid;
        await loadUserData();
        updateUI();
      }
    });

    async function loadUserData() {
      const userRef = doc(db, "users", currentUserId);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {
        userData = userSnap.data();
      } else {
        await setDoc(userRef, {
          createdAt: new Date(),
          referralCode: generateReferralCode(),
          referrals: 0,
          referralBonus: 0
        });
        userData = (await getDoc(userRef)).data();
      }
    }

    function generateReferralCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    function updateUI() {
      if (!userData) return;
      document.getElementById("referralCount").textContent = userData.referrals || 0;
      document.getElementById("referralBonus").textContent = (userData.referralBonus || 0).toFixed(5) + " C65";

      const currentUrl = window.location.href.split('?')[0].replace('invite-friends.html', '');
      document.getElementById("referralLink").value = `${currentUrl}?ref=${userData.referralCode}`;
    }

    window.copyReferralLink = function () {
      const referralLink = document.getElementById("referralLink");
      referralLink.select();
      referralLink.setSelectionRange(0, 99999); // For mobile devices
      navigator.clipboard.writeText(referralLink.value).then(() => {
        showPopup("Referral link copied!");
      }).catch(() => {
        alert("Failed to copy link. Please copy manually.");
      });
    };

    window.shareWhatsApp = function () {
      const link = document.getElementById("referralLink").value;
      // Share only the link for WhatsApp so preview shows properly
      window.open(`https://wa.me/?text=${encodeURIComponent(link)}`, "_blank");
    };

    window.shareTelegram = function () {
      const message = "Join Chain65 and earn crypto!";
      const url = document.getElementById("referralLink").value;
      const telegramShareURL = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(message)}`;
      window.open(telegramShareURL, "_blank");
    };

    window.shareFacebook = function () {
      const link = document.getElementById("referralLink").value;
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}`, "_blank");
    };

    function showPopup(message) {
      const popup = document.getElementById("popup");
      popup.textContent = message;
      popup.style.display = "block";
      setTimeout(() => {
        popup.style.display = "none";
      }, 2000);
    }
  </script>

</body>
</html>
